name: Build and publish blocklist

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: blocklist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Test
        run: python -m unittest discover -s tests -v

      # Fails, and so keeps the published lists, when a source cannot be fetched or is empty, or a canary
      # domain would be blocked.
      - name: Build
        run: python build.py --out dist

      - name: Summary
        run: |
          {
            echo "### Blocklist"
            echo
            python - <<'PY'
          import json
          s = json.load(open("dist/stats.json"))
          print("| tier | entries |")
          print("|---|---|")
          for t, v in s["tiers"].items():
              print(f"| {t} | {v['entries']:,} |")
          print()
          print("| source | domains | rejected lines |")
          print("|---|---|---|")
          for n, v in s["sources"].items():
              print(f"| {n} | {v['domains']:,} | {v['rejected']:,} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
