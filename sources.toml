# Blocklist sources. tiers: "full" = every source; "lite" = the ad/tracker sources only.
# A source that cannot be fetched or parses to zero domains stops the build, so the previously published
# list stays in place. Otherwise whatever upstream lists is the basis; its size is not tracked.

[[source]]
name = "hagezi-pro"
url = "https://hagezi-mirror.dnsbunker.org/adblock/pro.txt"
format = "adblock"
tiers = ["lite", "full"]

[[source]]
name = "hagezi-tif"
url = "https://hagezi-mirror.dnsbunker.org/adblock/tif.txt"
format = "adblock"
tiers = ["full"]

